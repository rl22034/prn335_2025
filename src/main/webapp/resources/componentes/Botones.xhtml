<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:ui="jakarta.faces.facelets"
                xmlns:cc="jakarta.faces.composite"
                xmlns:p="http://primefaces.org/ui"
                xmlns:h="jakarta.faces.html">

    <cc:interface>
        <cc:attribute name="beanName"
                      required="true"
                      type="java.lang.Object"
                      shortDescription="Bean controlador"/>

        <cc:attribute name="widgetVar"
                      required="true"
                      type="java.lang.String"
                      shortDescription="widgetVar del diálogo"/>

        <cc:attribute name="updateTabla"
                      required="true"
                      type="java.lang.String"
                      shortDescription="ID de la tabla a actualizar"/>

        <cc:attribute name="processDialog"
                      required="false"
                      type="java.lang.String"
                      default="@form"
                      shortDescription="ID del dialog/componente a procesar. Default: @form"/>
    </cc:interface>

    <cc:implementation>
        <div style="text-align: center; padding: 10px;">

            <!-- Botón AGREGAR -->
            <p:commandButton value="#{crud['boton.agregar']}"
                             icon="pi pi-save"
                             styleClass="ui-button-success"
                             style="margin: 0 5px;"
                             action="#{cc.attrs.beanName.btnAgregar}"
                             update="#{cc.attrs.updateTabla} :form:messages"
                             process="#{cc.attrs.processDialog}"
                             rendered="#{cc.attrs.beanName.estado.name() == 'CREAR'}"
                             oncomplete="if (args &amp;&amp; !args.validationFailed) PF('#{cc.attrs.widgetVar}').hide();"/>

            <!-- Botón ACTUALIZAR -->
            <p:commandButton value="#{crud['boton.actualizar']}"
                             icon="pi pi-refresh"
                             styleClass="ui-button-info"
                             style="margin: 0 5px;"
                             action="#{cc.attrs.beanName.btnActualizar}"
                             update="#{cc.attrs.updateTabla} :form:messages"
                             process="#{cc.attrs.processDialog}"
                             rendered="#{cc.attrs.beanName.estado.name() == 'MODIFICAR'}"
                             oncomplete="if (args &amp;&amp; !args.validationFailed) PF('#{cc.attrs.widgetVar}').hide();"/>

            <!-- Botón ELIMINAR -->
            <!-- Botón ELIMINAR -->
            <p:commandButton value="#{crud['boton.eliminar']}"
                             icon="pi pi-trash"
                             styleClass="ui-button-danger"
                             style="margin: 0 5px;"
                             action="#{cc.attrs.beanName.btnEliminar}"
                             update="#{cc.attrs.updateTabla} :form:messages"
                             process="#{cc.attrs.processDialog}"
                             rendered="#{cc.attrs.beanName.estado.name() == 'MODIFICAR'}"
                             oncomplete="if (args &amp;&amp; !args.validationFailed) PF('#{cc.attrs.widgetVar}').hide();">
                <p:confirm header="#{crud['mensaje.confirmar']}"
                           message="#{crud['mensaje.confirmacion.eliminar']}"
                           icon="pi pi-exclamation-triangle"/>
            </p:commandButton>

            <!-- Botón CANCELAR -->
            <p:commandButton value="#{crud['boton.cancelar']}"
                             icon="pi pi-times"
                             styleClass="ui-button-secondary"
                             style="margin: 0 5px;"
                             onclick="PF('#{cc.attrs.widgetVar}').hide(); return false;"
                             process="@none"/>

        </div>

        <!-- ConfirmDialog específico para este componente -->
        <p:confirmDialog global="true" showEffect="fade" hideEffect="fade">
            <p:commandButton value="#{crud['estado.si']}" type="button"
                             styleClass="ui-confirmdialog-yes" icon="pi pi-check" />
            <p:commandButton value="#{crud['estado.no']}" type="button"
                             styleClass="ui-confirmdialog-no" icon="pi pi-times" />
        </p:confirmDialog>

    </cc:implementation>
</ui:composition>
