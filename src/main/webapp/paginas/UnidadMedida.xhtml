<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:ui="jakarta.faces.facelets"
      xmlns:h="jakarta.faces.html"
      xmlns:f="jakarta.faces.core"
      xmlns:p="http://primefaces.org/ui"
      xmlns:comp="jakarta.faces.composite/componentes">

<ui:composition template="/WEB-INF/templates/template.xhtml">

    <ui:define name="pageTitle">
        #{crud['pagina.unidadMedida']}
    </ui:define>

    <ui:define name="content">

        <h:form id="form">

            <p:growl id="messages" showDetail="true" life="3000"/>

            <h:panelGroup id="tablaZone">
                <comp:Tabla beanName="#{unidadMedidaBean}"
                            lazyModel="#{unidadMedidaBean.lazyModel}"
                            seleccion="#{unidadMedidaBean.filaSeleccionada}"
                            titulo="#{crud['menu.unidadMedida']}"
                            widgetVarDialog="dlgUnidadMedida"
                            updateDialog=":form:dialogoWrapper"
                            rows="5"
                            table="tabla"
                            rowKey="#{tipo.id}">

                    <p:column headerText="#{crud['tabla.id']}" style="width: 80px;">
                        <h:outputText value="#{tipo.id}"/>
                    </p:column>

                    <p:column headerText="#{crud['tabla.tipoUnidadMedida']}" style="width: 200px;">
                        <h:outputText value="#{tipo.idTipoUnidadMedida.nombre}"/>
                    </p:column>

                    <p:column headerText="#{crud['tabla.equivalencia']}" style="width: 150px;">
                        <h:outputText value="#{tipo.equivalencia}">
                            <f:convertNumber pattern="#0.00"/>
                        </h:outputText>
                    </p:column>

                    <p:column headerText="#{crud['tabla.expresionRegular']}" style="width: 250px;">
                        <h:outputText value="#{tipo.expresionRegular}"
                                      style="max-width: 250px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; display: block;"/>
                    </p:column>

                    <p:column headerText="#{crud['tabla.activo']}" style="width: 120px;">
                        <h:outputText value="#{tipo.activo ? crud['estado.si'] : crud['estado.no']}"/>
                    </p:column>

                </comp:Tabla>
            </h:panelGroup>

            <h:panelGroup id="dialogoWrapper">
                <comp:DialogCrud beanName="#{unidadMedidaBean}"
                                 entidadSeleccionada="#{unidadMedidaBean.filaSeleccionada}"
                                 widgetVar="dlgUnidadMedida"
                                 dialogId="dlgCrud"
                                 updateTabla=":form:tablaZone"
                                 header="#{crud['pagina.unidadMedida']}"
                                 width="600"
                                 maxContentHeight="70vh"
                                 labelId="#{crud['form.id']}"
                                 mostrarNombre="false"
                                 mostrarActivo="true"
                                 labelActivo="#{crud['form.activo']}"
                                 atributoActivo="activo"
                                 mostrarObservaciones="true"
                                 labelObservaciones="#{crud['form.comentarios']}"
                                 atributoObservaciones="comentarios">

                    <!-- SELECTOR DE TIPO UNIDAD MEDIDA -->
                    <f:facet name="tipoUnidadMedida">
                        <div style="margin-bottom: 15px;">
                            <h:outputLabel value="#{crud['form.tipoUnidadMedida']}:"
                                           for="selectTipoUnidadMedida"
                                           style="display: block; margin-bottom: 5px; font-weight: bold;"/>
                            <p:selectOneMenu id="selectTipoUnidadMedida"
                                             value="#{unidadMedidaBean.filaSeleccionada.idTipoUnidadMedida}"
                                             converter="tipoUnidadMedidaConverter"
                                             style="width: 100%;"
                                             required="true"
                                             requiredMessage="#{crud['validacion.tipounidadmedida.requerido']}">
                                <f:selectItem itemLabel="#{crud['form.seleccione']}" itemValue="#{null}"/>
                                <f:selectItems value="#{unidadMedidaBean.tipoUnidadMedidaList}"
                                               var="t"
                                               itemLabel="#{t.nombre}"
                                               itemValue="#{t}"/>
                            </p:selectOneMenu>
                        </div>
                    </f:facet>

                    <!-- CAMPO EQUIVALENCIA -->
                    <f:facet name="equivalencia">
                        <div style="margin-bottom: 15px;">
                            <h:outputLabel value="#{crud['form.equivalencia']}:"
                                           for="txtEquivalencia"
                                           style="display: block; margin-bottom: 5px; font-weight: bold;"/>
                            <p:inputNumber id="txtEquivalencia"
                                           value="#{unidadMedidaBean.filaSeleccionada.equivalencia}"
                                           decimalPlaces="2"
                                           minFractionDigits="2"
                                           decimalSeparator="."
                                           thousandSeparator=","
                                           minValue="0"
                                           maxValue="999999.99"
                                           style="width: 100%;"
                                           required="true"
                                           requiredMessage="#{crud['validacion.equivalencia.requerida']}"/>
                        </div>
                    </f:facet>

                    <!-- CAMPO EXPRESIÓN REGULAR -->
                    <f:facet name="expresionRegular">
                        <div style="margin-bottom: 15px;">
                            <h:outputLabel value="#{crud['form.expresionRegular']}:"
                                           for="txtExpresionRegular"
                                           style="display: block; margin-bottom: 5px; font-weight: bold;"/>
                            <p:inputTextarea id="txtExpresionRegular"
                                             value="#{unidadMedidaBean.filaSeleccionada.expresionRegular}"
                                             rows="3"
                                             maxlength="500"
                                             style="width: 100%;"/>
                        </div>
                    </f:facet>

                </comp:DialogCrud>
            </h:panelGroup>

        </h:form>
    </ui:define>

</ui:composition>
</html>
