<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:ui="jakarta.faces.facelets"
      xmlns:h="jakarta.faces.html"
      xmlns:f="jakarta.faces.core"
      xmlns:p="http://primefaces.org/ui"
      xmlns:comp="jakarta.faces.composite/componentes">

<ui:composition template="/WEB-INF/templates/template.xhtml">

    <ui:define name="pageTitle">
        #{crud['pagina.unidadMedida']}
    </ui:define>

    <ui:define name="content">

        <h:form id="form">

            <p:growl id="messages"
                     showDetail="true"
                     life="3000"
                     autoUpdate="true"/>

            <h:panelGroup id="tablaZone">
                <comp:Tabla beanName="#{unidadMedidaBean}"
                            lazyModel="#{unidadMedidaBean.lazyModel}"
                            seleccion="#{unidadMedidaBean.filaSeleccionada}"
                            titulo="#{crud['menu.unidadMedida']}"
                            widgetVarDialog="dlgUnidadMedida"
                            updateDialog=":form:dialogoWrapper"
                            rows="5"
                            table="tabla"
                            rowKey="#{tipo.id}">

                    <p:column headerText="#{crud['tabla.id']}" style="width: 80px;">
                        <h:outputText value="#{tipo.id}" />
                    </p:column>

                    <p:column headerText="#{crud['tabla.tipoUnidadMedida']}">
                        <h:outputText value="#{tipo.idTipoUnidadMedida != null ? tipo.idTipoUnidadMedida.nombre : '-'}" />
                    </p:column>

                    <p:column headerText="#{crud['tabla.equivalencia']}">
                        <h:outputText value="#{tipo.equivalencia}">
                            <f:convertNumber type="number" minFractionDigits="2" maxFractionDigits="2"/>
                        </h:outputText>
                    </p:column>

                    <p:column headerText="#{crud['tabla.activo']}" style="width: 100px;">
                        <h:outputText value="#{tipo.activo ? crud['estado.si'] : crud['estado.no']}" />
                    </p:column>

                    <p:column headerText="#{crud['tabla.expresionRegular']}">
                        <h:outputText value="#{tipo.expresionRegular}" />
                    </p:column>

                    <p:column headerText="#{crud['tabla.comentarios']}">
                        <h:outputText value="#{tipo.comentarios}" />
                    </p:column>

                </comp:Tabla>
            </h:panelGroup>

            <h:panelGroup id="dialogoWrapper">
                <comp:DialogCrud beanName="#{unidadMedidaBean}"
                                 entidadSeleccionada="#{unidadMedidaBean.filaSeleccionada}"
                                 widgetVar="dlgUnidadMedida"
                                 dialogId="dlgCrud"
                                 updateTabla=":form:tablaZone"
                                 header="#{crud['pagina.unidadMedida']}"
                                 width="600"
                                 maxContentHeight="60vh"
                                 labelId="#{crud['form.id']}"
                                 labelActivo="#{crud['form.activo']}"
                                 labelObservaciones="#{crud['form.comentarios']}"
                                 atributoObservaciones="comentarios"
                                 mostrarNombre="false">

                    <!-- Tipo Unidad Medida -->
                    <f:facet name="tipoUnidadMedida">
                        <div style="margin-bottom: 15px;">
                            <h:outputLabel value="#{crud['form.tipoUnidadMedida']}:"
                                           for="cboTipoUnidadMedida"
                                           style="display: block; margin-bottom: 5px; font-weight: bold;"/>
                            <p:selectOneMenu id="cboTipoUnidadMedida"
                                             value="#{unidadMedidaBean.filaSeleccionada.idTipoUnidadMedida}"
                                             required="true"
                                             requiredMessage="#{crud['validacion.tipoUnidadMedida.requerido']}"
                                             style="width: 100%;"
                                             converter="omnifaces.SelectItemsConverter">
                                <f:selectItem itemLabel="#{crud['form.seleccione']}" itemValue="#{null}" noSelectionOption="true"/>
                                <f:selectItems value="#{unidadMedidaBean.tipoUnidadMedidaList}"
                                               var="tipo"
                                               itemLabel="#{tipo.nombre}"
                                               itemValue="#{tipo}"/>
                            </p:selectOneMenu>
                        </div>
                    </f:facet>

                    <!-- Equivalencia -->
                    <f:facet name="equivalencia">
                        <div style="margin-bottom: 15px;">
                            <h:outputLabel value="#{crud['form.equivalencia']}:"
                                           for="txtEquivalencia"
                                           style="display: block; margin-bottom: 5px; font-weight: bold;"/>
                            <p:inputNumber id="txtEquivalencia"
                                           value="#{unidadMedidaBean.filaSeleccionada.equivalencia}"
                                           decimalPlaces="2"
                                           required="true"
                                           requiredMessage="#{crud['validacion.equivalencia.requerida']}"
                                           style="width: 100%;"/>
                        </div>
                    </f:facet>

                    <!-- Expresión Regular -->
                    <f:facet name="expresionRegular">
                        <div style="margin-bottom: 15px;">
                            <h:outputLabel value="#{crud['form.expresionRegular']}:"
                                           for="txtExpresionRegular"
                                           style="display: block; margin-bottom: 5px; font-weight: bold;"/>
                            <p:inputTextarea id="txtExpresionRegular"
                                             value="#{unidadMedidaBean.filaSeleccionada.expresionRegular}"
                                             rows="3"
                                             style="width: 100%;"/>
                        </div>
                    </f:facet>

                </comp:DialogCrud>
            </h:panelGroup>

        </h:form>

    </ui:define>

</ui:composition>
</html>
