<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:ui="jakarta.faces.facelets"
      xmlns:h="jakarta.faces.html"
      xmlns:f="jakarta.faces.core"
      xmlns:p="http://primefaces.org/ui"
      xmlns:comp="jakarta.faces.composite/componentes">

<ui:composition template="/WEB-INF/templates/template.xhtml">

    <ui:define name="pageTitle">
        #{crud['pagina.tipoProducto']}
    </ui:define>

    <ui:define name="content">

        <h:form id="form">

            <p:growl id="messages"
                     showDetail="true"
                     life="3000"
                     autoUpdate="true"/>

            <h:panelGroup id="tablaZone">
                <div class="main-container">

                    <div class="header">
                        <h1 class="page-title">#{crud['menu.tipoProducto']}</h1>
                    </div>

                    <div class="boton-nuevo-derecha">
                        <p:commandButton value="#{crud['boton.nuevo']}"
                                         icon="pi pi-plus"
                                         styleClass="ui-button-success"
                                         action="#{tipoProductoBean.btnNuevo}"
                                         process="@this"
                                         update="@none"
                                         oncomplete="PF('dlgTipoProducto').show()"/>
                    </div>

                    <div class="tabla-container">
                        <p:treeTable id="treeTabla"
                                     value="#{tipoProductoBean.rootNode}"
                                     var="tipo"
                                     selectionMode="single"
                                     selection="#{tipoProductoBean.selectedNode}"
                                     styleClass="tabla-moderna"
                                     paginator="true"
                                     rows="10"
                                     paginatorPosition="bottom"
                                     paginatorTemplate="{RowsPerPageDropdown} {FirstPageLink} {PreviousPageLink} {CurrentPageReport} {NextPageLink} {LastPageLink}">

                            <p:ajax event="select"
                                    listener="#{tipoProductoBean.onNodeSelect}"
                                    update=":form:dialogoWrapper"
                                    oncomplete="setTimeout(function(){ PF('dlgTipoProducto').show(); }, 100);"/>

                            <p:column headerText="#{crud['tabla.nombre']}">
                                <h:outputText value="#{tipo.nombre}" />
                            </p:column>

                            <p:column headerText="ID" style="width: 80px;">
                                <h:outputText value="#{tipo.id}" />
                            </p:column>

                            <p:column headerText="Estado" style="text-align: center; width: 100px;">
                                <p:tag value="#{tipo.activo ? 'Activo' : 'Inactivo'}"
                                       severity="#{tipo.activo ? 'success' : 'danger'}"/>
                            </p:column>

                            <p:column headerText="Observaciones">
                                <h:outputText value="#{tipo.comentarios}"
                                              style="display: block; max-width: 300px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;"/>
                            </p:column>

                        </p:treeTable>
                    </div>
                </div>
            </h:panelGroup>

            <h:panelGroup id="dialogoWrapper">
                <p:dialog id="dlgTipoProducto"
                          widgetVar="dlgTipoProducto"
                          header="#{crud['pagina.tipoProducto']}"
                          modal="true"
                          width="800"
                          height="600">

                    <p:tabView id="tabsTipoProducto" dynamic="false">

                        <p:tab title="#{crud['tabs.generalidades']}" id="tabGeneralidades">

                            <div style="padding: 20px;">

                                <div style="margin-bottom: 15px;">
                                    <h:outputLabel for="txtId" value="ID"
                                                   style="display: block; margin-bottom: 5px; font-weight: bold;"/>
                                    <p:inputText id="txtId"
                                                 value="#{tipoProductoBean.filaSeleccionada.id}"
                                                 disabled="true"
                                                 style="width: 100%; background-color: #f0f0f0;"/>
                                </div>

                                <div style="margin-bottom: 15px;">
                                    <h:outputLabel for="txtNombre" value="Nombre *"
                                                   style="display: block; margin-bottom: 5px; font-weight: bold;"/>
                                    <p:inputText id="txtNombre"
                                                 value="#{tipoProductoBean.filaSeleccionada.nombre}"
                                                 required="true"
                                                 placeholder="Ej: Herramientas, Materiales..."
                                                 requiredMessage="#{crud['validacion.nombre.requerido']}"
                                                 style="width: 100%;"/>
                                </div>

                                <div style="margin-bottom: 15px;">
                                    <h:outputLabel for="selectPadre" value="Categoría Padre"
                                                   style="display: block; margin-bottom: 5px; font-weight: bold;"/>
                                    <p:selectOneMenu id="selectPadre"
                                                     value="#{tipoProductoBean.idPadreSeleccionado}"
                                                     style="width: 100%;">
                                        <f:selectItem itemLabel="-- Ninguna (Categoría Principal) --" itemValue="#{null}"/>
                                        <f:selectItems value="#{tipoProductoBean.tipoProductoList}"
                                                       var="t"
                                                       itemLabel="#{t.nombre}"
                                                       itemValue="#{t.id}"/>
                                    </p:selectOneMenu>
                                </div>

                                <div style="margin-bottom: 15px;">
                                    <h:outputLabel for="chkActivo" value="Activo"
                                                   style="display: block; margin-bottom: 5px; font-weight: bold;"/>
                                    <p:selectBooleanCheckbox id="chkActivo"
                                                             value="#{tipoProductoBean.filaSeleccionada.activo}"/>
                                </div>

                                <div style="margin-bottom: 15px;">
                                    <h:outputLabel for="txtComentarios" value="Comentarios"
                                                   style="display: block; margin-bottom: 5px; font-weight: bold;"/>
                                    <p:inputTextarea id="txtComentarios"
                                                     value="#{tipoProductoBean.filaSeleccionada.comentarios}"
                                                     rows="4"
                                                     placeholder="Descripción o comentarios adicionales..."
                                                     style="width: 100%;"/>
                                </div>

                                <div style="margin-top: 30px; padding-top: 20px; border-top: 1px solid #ddd; text-align: center;">
                                    <p:commandButton value="#{crud['boton.agregar']}"
                                                     icon="pi pi-save"
                                                     styleClass="ui-button-success"
                                                     action="#{tipoProductoBean.btnAgregar}"
                                                     process="dlgTipoProducto"
                                                     update=":form:messages :form:tablaZone :form:dialogoWrapper"
                                                     oncomplete="if (args &amp;&amp; !args.validationFailed) { PF('dlgTipoProducto').hide(); }"
                                                     rendered="#{tipoProductoBean.estado == 'CREAR'}"
                                                     style="margin: 0 5px;"/>

                                    <p:commandButton value="#{crud['boton.actualizar']}"
                                                     icon="pi pi-refresh"
                                                     styleClass="ui-button-info"
                                                     action="#{tipoProductoBean.btnActualizar}"
                                                     process="dlgTipoProducto"
                                                     update=":form:messages :form:tablaZone :form:dialogoWrapper"
                                                     oncomplete="if (args &amp;&amp; !args.validationFailed) { PF('dlgTipoProducto').hide(); }"
                                                     rendered="#{tipoProductoBean.estado == 'MODIFICAR'}"
                                                     style="margin: 0 5px;"/>

                                    <p:commandButton value="#{crud['boton.eliminar']}"
                                                     icon="pi pi-trash"
                                                     styleClass="ui-button-danger"
                                                     action="#{tipoProductoBean.btnEliminar}"
                                                     process="@this"
                                                     update=":form:messages :form:tablaZone :form:dialogoWrapper"
                                                     rendered="#{tipoProductoBean.estado == 'MODIFICAR'}"
                                                     style="margin: 0 5px;">
                                        <p:confirm header="#{crud['mensaje.confirmar']}"
                                                   message="#{crud['mensaje.confirmacion.eliminar']}"
                                                   icon="pi pi-exclamation-triangle"/>
                                    </p:commandButton>

                                    <p:commandButton value="#{crud['boton.cancelar']}"
                                                     icon="pi pi-times"
                                                     styleClass="ui-button-secondary"
                                                     onclick="PF('dlgTipoProducto').hide(); return false;"
                                                     process="@none"
                                                     style="margin: 0 5px;"/>
                                </div>

                            </div>

                        </p:tab>

                        <p:tab title="#{crud['tabs.caracteristicas']}"
                               id="tabCaracteristicas"
                               disabled="#{tipoProductoBean.estado == 'CREAR' or tipoProductoBean.filaSeleccionada.id == null}">

                            <div style="padding: 20px;">

                                <div style="margin-bottom: 15px;">
                                    <p:commandButton value="#{crud['boton.nuevo']}"
                                                     icon="pi pi-plus"
                                                     styleClass="ui-button-success"
                                                     action="#{tipoProductoCaracteristicaBean.btnNuevo}"
                                                     process="@this"
                                                     update=":form:dialogCaracteristicaWrapper"
                                                     oncomplete="PF('dlgCaracteristicaNested').show()"
                                                     disabled="#{tipoProductoBean.filaSeleccionada.id == null}">
                                        <f:setPropertyActionListener target="#{tipoProductoCaracteristicaBean.tipoProductoActual}"
                                                                     value="#{tipoProductoBean.filaSeleccionada}"/>
                                    </p:commandButton>
                                </div>

                                <h:panelGroup id="tablaCaracteristicasZone">
                                    <p:dataTable id="tablaCaracteristicas"
                                                 var="tpc"
                                                 value="#{tipoProductoBean.tipoProductoCaracteristicasList}"
                                                 styleClass="tabla-moderna"
                                                 paginator="true"
                                                 rows="5"
                                                 paginatorPosition="bottom"
                                                 paginatorTemplate="{RowsPerPageDropdown} {FirstPageLink} {PreviousPageLink} {CurrentPageReport} {NextPageLink} {LastPageLink}"
                                                 selectionMode="single"
                                                 selection="#{tipoProductoCaracteristicaBean.filaSeleccionada}"
                                                 rowKey="#{tpc.id}"
                                                 emptyMessage="#{crud['mensaje.sin.registros']}">

                                        <p:ajax event="rowSelect"
                                                listener="#{tipoProductoCaracteristicaBean.onRowSelect}"
                                                update=":form:dialogCaracteristicaWrapper"
                                                immediate="true"
                                                oncomplete="PF('dlgCaracteristicaNested').show()"/>

                                        <p:column headerText="ID" style="width: 80px;">
                                            <h:outputText value="#{tpc.id}" />
                                        </p:column>

                                        <p:column headerText="Característica">
                                            <h:outputText value="#{tpc.idCaracteristica != null ? tpc.idCaracteristica.nombre : ''}" />
                                        </p:column>

                                        <p:column headerText="Obligatoria" style="text-align: center; width: 120px;">
                                            <p:tag value="#{tpc.obligatorio != null and tpc.obligatorio ? 'Sí' : 'No'}"
                                                   severity="#{tpc.obligatorio != null and tpc.obligatorio ? 'warning' : 'info'}"/>
                                        </p:column>

                                        <p:column headerText="Fecha de Creación" style="width: 150px;">
                                            <h:outputText value="#{tpc.fechaCreacion}">
                                                <f:converter converterId="offsetDateTimeConverter"/>
                                            </h:outputText>
                                        </p:column>

                                    </p:dataTable>
                                </h:panelGroup>

                            </div>

                        </p:tab>

                    </p:tabView>

                </p:dialog>
            </h:panelGroup>

            <h:panelGroup id="dialogCaracteristicaWrapper">
                <p:dialog id="dlgCaracteristicaNested"
                          widgetVar="dlgCaracteristicaNested"
                          header="#{crud['pagina.caracteristica']}"
                          modal="true"
                          width="500"
                          appendTo="@(body)">

                    <h:form id="formCarac">
                        <div style="padding: 15px;">

                            <div style="margin-bottom: 15px;">
                                <h:outputLabel value="ID"
                                               for="txtIdCarac"
                                               style="display: block; margin-bottom: 5px; font-weight: bold;"/>
                                <p:inputText id="txtIdCarac"
                                             value="#{tipoProductoCaracteristicaBean.filaSeleccionada.id}"
                                             disabled="true"
                                             style="width: 100%; background-color: #f0f0f0;"/>
                            </div>

                            <div style="margin-bottom: 15px;">
                                <h:outputLabel value="Característica *"
                                               for="selectCaracteristica"
                                               style="display: block; margin-bottom: 5px; font-weight: bold;"/>
                                <p:selectOneMenu id="selectCaracteristica"
                                                 value="#{tipoProductoCaracteristicaBean.filaSeleccionada.idCaracteristica}"
                                                 converter="caracteristicaConverter"
                                                 style="width: 100%;"
                                                 required="true"
                                                 requiredMessage="Debe seleccionar una característica">
                                    <f:selectItem itemLabel="-- Seleccione una característica --" itemValue="#{null}"/>
                                    <f:selectItems value="#{tipoProductoCaracteristicaBean.caracteristicasList}"
                                                   var="c"
                                                   itemLabel="#{c.nombre}"
                                                   itemValue="#{c}"/>
                                </p:selectOneMenu>
                            </div>

                            <div style="margin-bottom: 15px;">
                                <h:outputLabel value="Obligatoria"
                                               for="chkObligatoria"
                                               style="display: block; margin-bottom: 5px; font-weight: bold;"/>
                                <p:selectBooleanCheckbox id="chkObligatoria"
                                                         value="#{tipoProductoCaracteristicaBean.filaSeleccionada.obligatorio}"/>
                            </div>

                            <div style="margin-bottom: 15px;">
                                <h:outputLabel value="Fecha de creación"
                                               for="txtFechaCreacion"
                                               style="display: block; margin-bottom: 5px; font-weight: bold;"/>
                                <p:inputText id="txtFechaCreacion"
                                             value="#{tipoProductoCaracteristicaBean.filaSeleccionada.fechaCreacion}"
                                             disabled="true"
                                             style="width: 100%; background-color: #f0f0f0;">
                                    <f:converter converterId="offsetDateTimeConverter"/>
                                </p:inputText>
                            </div>

                            <div style="margin-top: 30px; padding-top: 20px; border-top: 1px solid #ddd; text-align: center;">
                                <p:commandButton value="#{crud['boton.agregar']}"
                                                 icon="pi pi-save"
                                                 styleClass="ui-button-success"
                                                 action="#{tipoProductoCaracteristicaBean.btnAgregar}"
                                                 process="@form"
                                                 update="@form :form:messages :form:dialogoWrapper"
                                                 oncomplete="if (args &amp;&amp; !args.validationFailed) { PF('dlgCaracteristicaNested').hide(); }"
                                                 rendered="#{tipoProductoCaracteristicaBean.estado == 'CREAR'}"
                                                 style="margin: 0 5px;"/>

                                <p:commandButton value="#{crud['boton.actualizar']}"
                                                 icon="pi pi-refresh"
                                                 styleClass="ui-button-info"
                                                 action="#{tipoProductoCaracteristicaBean.btnActualizar}"
                                                 process="@form"
                                                 update="@form :form:messages :form:dialogoWrapper"
                                                 oncomplete="if (args &amp;&amp; !args.validationFailed) { PF('dlgCaracteristicaNested').hide(); }"
                                                 rendered="#{tipoProductoCaracteristicaBean.estado == 'MODIFICAR'}"
                                                 style="margin: 0 5px;"/>

                                <p:commandButton value="#{crud['boton.eliminar']}"
                                                 icon="pi pi-trash"
                                                 styleClass="ui-button-danger"
                                                 action="#{tipoProductoCaracteristicaBean.btnEliminar}"
                                                 process="@this"
                                                 update=":form:messages :form:dialogoWrapper"
                                                 rendered="#{tipoProductoCaracteristicaBean.estado == 'MODIFICAR'}"
                                                 style="margin: 0 5px;">
                                    <p:confirm header="#{crud['confirmacion.titulo']}"
                                               message="#{crud['confirmacion.eliminar.mensaje']}"
                                               icon="pi pi-exclamation-triangle"/>
                                </p:commandButton>

                                <p:commandButton value="#{crud['boton.cancelar']}"
                                                 icon="pi pi-times"
                                                 styleClass="ui-button-secondary"
                                                 onclick="PF('dlgCaracteristicaNested').hide(); return false;"
                                                 process="@none"
                                                 style="margin: 0 5px;"/>
                            </div>

                        </div>
                    </h:form>
                </p:dialog>
            </h:panelGroup>

            <p:confirmDialog global="true" showEffect="fade" hideEffect="fade">
                <p:commandButton value="#{crud['boton.si']}" type="button"
                                 styleClass="ui-confirmdialog-yes" icon="pi pi-check" />
                <p:commandButton value="#{crud['boton.no']}" type="button"
                                 styleClass="ui-confirmdialog-no" icon="pi pi-times" />
            </p:confirmDialog>

        </h:form>

    </ui:define>

</ui:composition>
</html>
