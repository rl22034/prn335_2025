<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:ui="jakarta.faces.facelets"
      xmlns:h="jakarta.faces.html"
      xmlns:f="jakarta.faces.core"
      xmlns:p="http://primefaces.org/ui"
      xmlns:comp="jakarta.faces.composite/componentes">

<ui:composition template="/WEB-INF/templates/template.xhtml">

    <ui:define name="pageTitle">
        #{crud['pagina.producto']}
    </ui:define>

    <ui:define name="content">

        <h:form id="form">

            <p:growl id="messages" showDetail="true" life="3000" autoUpdate="true"/>

            <h:panelGroup style="margin-top: 20px;" layout="block">
                <div style="text-align: right; margin-bottom: 10px;">
                    <p:commandButton value="Reporte Kardex"
                                     icon="pi pi-file-pdf"
                                     styleClass="ui-button-warning"
                                     onclick="PF('dlgReporte').show()"
                                     ajax="false"
                                     type="button"
                                     process="@none"
                                     style="margin-left: 10px;"/>
                </div>
            </h:panelGroup>

            <h:panelGroup id="tablaZone">
                <comp:Tabla beanName="#{productoBean}"
                            lazyModel="#{productoBean.lazyModel}"
                            seleccion="#{productoBean.filaSeleccionada}"
                            titulo="#{crud['menu.producto']}"
                            widgetVarDialog="dlgProducto"
                            updateDialog=":form:dialogoWrapper"
                            rows="10"
                            table="tabla"
                            rowKey="#{tipo.id}">

                    <p:column headerText="#{crud['tabla.id']}" style="width: 250px;">
                        <h:outputText value="#{tipo.id}" />
                    </p:column>

                    <p:column headerText="#{crud['tabla.nombre']}">
                        <h:outputText value="#{tipo.nombreProducto}" />
                    </p:column>

                    <p:column headerText="#{crud['tabla.referenciaExterna']}" style="width: 200px;">
                        <h:outputText value="#{tipo.referenciaExterna}" />
                    </p:column>

                    <p:column headerText="#{crud['tabla.activo']}" style="width: 100px;">
                        <h:outputText value="#{tipo.activo ? crud['estado.si'] : crud['estado.no']}" />
                    </p:column>

                    <p:column headerText="#{crud['tabla.comentarios']}" style="width: 250px;">
                        <h:outputText value="#{tipo.comentarios}" style="max-width: 250px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; display: block;"/>
                    </p:column>

                </comp:Tabla>
            </h:panelGroup>

            <h:panelGroup id="dialogoWrapper">
                <p:dialog id="dlgProducto" widgetVar="dlgProducto" header="#{crud['pagina.producto']}" modal="true" width="800" height="600">
                    <p:tabView id="tabsProducto" dynamic="false">
                        <p:ajax event="tabChange" listener="#{productoTipoProductoBean.recargarTabla}" update="tablaProductoTipoProductoZone"/>

                        <p:tab title="#{crud['tabs.generalidades']}" id="tabGeneralidades">
                            <div style="padding: 20px;">
                                <div style="margin-bottom: 15px;">
                                    <h:outputLabel for="txtId" value="#{crud['form.id']}" style="display: block; margin-bottom: 5px; font-weight: bold;"/>
                                    <p:inputText id="txtId" value="#{productoBean.filaSeleccionada.id}" disabled="true" style="width: 100%; background-color: #f0f0f0;"/>
                                </div>
                                <div style="margin-bottom: 15px;">
                                    <h:outputLabel for="txtNombre" value="#{crud['form.nombre']}" style="display: block; margin-bottom: 5px; font-weight: bold;"/>
                                    <p:inputText id="txtNombre" value="#{productoBean.filaSeleccionada.nombreProducto}" required="true" requiredMessage="#{crud['validacion.nombre.requerido']}" style="width: 100%;"/>
                                </div>
                                <div style="margin-bottom: 15px;">
                                    <h:outputLabel for="txtReferenciaExterna" value="#{crud['tabla.referenciaExterna']}" style="display: block; margin-bottom: 5px; font-weight: bold;"/>
                                    <p:inputTextarea id="txtReferenciaExterna" value="#{productoBean.filaSeleccionada.referenciaExterna}" rows="3" style="width: 100%;"/>
                                </div>
                                <div style="margin-bottom: 15px;">
                                    <h:outputLabel for="chkActivo" value="#{crud['form.activo']}" style="display: block; margin-bottom: 5px; font-weight: bold;"/>
                                    <p:selectBooleanCheckbox id="chkActivo" value="#{productoBean.filaSeleccionada.activo}"/>
                                </div>
                                <div style="margin-bottom: 15px;">
                                    <h:outputLabel for="txtAreaComentarios" value="#{crud['form.comentarios']}" style="display: block; margin-bottom: 5px; font-weight: bold;"/>
                                    <p:inputTextarea id="txtAreaComentarios" value="#{productoBean.filaSeleccionada.comentarios}" rows="4" style="width: 100%;"/>
                                </div>
                                <comp:Botones beanName="#{productoBean}" widgetVar="dlgProducto" updateTabla=":form:tablaZone" processDialog="dlgProducto"/>
                            </div>
                        </p:tab>

                        <p:tab title="#{crud['tabs.tiposProducto']}" id="tabTiposProducto" disabled="#{productoBean.filaSeleccionada.id == null}">
                            <div style="padding: 20px;">
                                <h3 style="text-align: center; margin-bottom: 20px;">#{productoBean.filaSeleccionada.nombreProducto}</h3>
                                <div style="text-align: right; margin-bottom: 10px;">
                                    <p:commandButton value="#{crud['boton.nuevo']}" icon="pi pi-plus" styleClass="ui-button-success" action="#{productoTipoProductoBean.btnNuevo}" process="@this" update=":form:dialogProductoTipoProductoWrapper" oncomplete="PF('dlgProductoTipoProducto').show()"/>
                                </div>
                                <h:panelGroup id="tablaProductoTipoProductoZone">
                                    <comp:Tabla beanName="#{productoTipoProductoBean}" lazyModel="#{productoTipoProductoBean.lazyModel}" seleccion="#{productoTipoProductoBean.filaSeleccionada}" titulo="Tipos de Producto Asociados" widgetVarDialog="dlgProductoTipoProducto" updateDialog=":form:dialogProductoTipoProductoWrapper" rows="5" table="tablaProductoTipoProducto" rowKey="#{tipo.id}" mostrarBotonNuevo="false">
                                        <p:column headerText="#{crud['tabla.id']}" style="width: 250px;">
                                            <h:outputText value="#{tipo.id}" />
                                        </p:column>
                                        <p:column headerText="Tipo de Producto">
                                            <h:outputText value="#{tipo.idTipoProducto.nombre}" />
                                        </p:column>
                                        <p:column headerText="Fecha Creación" style="width: 150px;">
                                            <h:outputText value="#{tipo.fechaCreacion}">
                                                <f:convertDateTime pattern="dd/MM/yyyy HH:mm" type="localDateTime"/>
                                            </h:outputText>
                                        </p:column>
                                        <p:column headerText="#{crud['tabla.activo']}" style="width: 100px;">
                                            <h:outputText value="#{tipo.activo ? crud['estado.si'] : crud['estado.no']}" />
                                        </p:column>
                                    </comp:Tabla>
                                </h:panelGroup>
                            </div>
                        </p:tab>
                    </p:tabView>
                </p:dialog>
            </h:panelGroup>

            <h:panelGroup id="dialogProductoTipoProductoWrapper">
                <p:dialog id="dlgProductoTipoProducto" widgetVar="dlgProductoTipoProducto" header="#{crud['producto.tipoProducto.titulo']}" modal="true" width="900" fitViewport="true" maximizable="true" responsive="true">
                    <div style="padding: 20px; max-height: 60vh; overflow-y: auto;">
                        <div style="margin-bottom: 15px;">
                            <h:outputLabel value="ID:" style="display: block; margin-bottom: 5px; font-weight: bold;"/>
                            <p:inputText value="#{productoTipoProductoBean.filaSeleccionada.id}" disabled="true" style="width: 100%; background-color: #f0f0f0;"/>
                        </div>
                        <div style="margin-bottom: 15px;">
                            <h:outputLabel value="#{crud['producto.tipoProducto.tipo']}:" style="display: block; margin-bottom: 5px; font-weight: bold;"/>
                            <p:selectOneMenu id="selectTipoProducto" value="#{productoTipoProductoBean.tipoProductoSeleccionado}" converter="tipoProductoConverter" style="width: 100%;" required="true" requiredMessage="#{crud['validacion.tipoproducto.requerido']}">
                                <f:selectItem itemLabel="#{crud['form.seleccione']}" itemValue="#{null}"/>
                                <f:selectItems value="#{productoTipoProductoBean.tiposProductoActivos}" var="t" itemLabel="#{t.nombre}" itemValue="#{t}"/>
                                <p:ajax listener="#{productoTipoProductoBean.onTipoProductoChange}" update="pickListCaracteristicas valoresCaracteristicas"/>
                            </p:selectOneMenu>
                        </div>
                        <div style="margin-bottom: 15px;">
                            <h:outputLabel value="#{crud['producto.tipoProducto.caracteristicas']}:" style="display: block; margin-bottom: 5px; font-weight: bold;"/>
                            <p:pickList id="pickListCaracteristicas" value="#{productoTipoProductoBean.caracteristicasPickList}" var="carac" itemLabel="#{carac.idCaracteristica.nombre}" itemValue="#{carac}" converter="tipoProductoCaracteristicaConverter" showSourceControls="true" showTargetControls="true" responsive="true" style="height: 200px;" listStyle="height: 200px;">
                                <f:facet name="sourceCaption">#{crud['producto.tipoProducto.disponibles']}</f:facet>
                                <f:facet name="targetCaption">#{crud['producto.tipoProducto.asignadas']}</f:facet>
                                <p:ajax event="transfer" update="valoresCaracteristicas"/>
                            </p:pickList>
                        </div>
                        <h:panelGroup id="valoresCaracteristicas">
                            <p:panel header="#{crud['producto.tipoProducto.valoresAsignados']}" rendered="#{not empty productoTipoProductoBean.caracteristicasPickList.target}" style="margin-bottom: 15px;">
                                <p:dataTable value="#{productoTipoProductoBean.caracteristicasPickList.target}" var="caracAsignada" style="margin-top: 10px;">
                                    <p:column headerText="#{crud['producto.tipoProducto.caracteristica']}" style="width: 40%;">
                                        <h:outputText value="#{caracAsignada.idCaracteristica.nombre}"/>
                                    </p:column>
                                    <p:column headerText="#{crud['producto.tipoProducto.valor']}">
                                        <p:inputText value="#{productoTipoProductoBean.valoresCaracteristicas[caracAsignada.id]}" placeholder="Ingrese el valor" style="width: 100%;"/>
                                    </p:column>
                                    <p:column headerText="#{crud['producto.tipoProducto.unidad']}" style="width: 20%;">
                                        <h:outputText value="#{caracAsignada.idCaracteristica.idTipoUnidadMedida.nombre}" rendered="#{caracAsignada.idCaracteristica.idTipoUnidadMedida != null}"/>
                                    </p:column>
                                </p:dataTable>
                            </p:panel>
                        </h:panelGroup>
                        <div style="margin-bottom: 15px;">
                            <h:outputLabel value="#{crud['form.activo']}" style="display: block; margin-bottom: 5px; font-weight: bold;"/>
                            <p:selectBooleanCheckbox value="#{productoTipoProductoBean.filaSeleccionada.activo}"/>
                        </div>
                        <div style="margin-bottom: 15px;">
                            <h:outputLabel value="#{crud['producto.tipoProducto.fechaCreacion']}:" style="display: block; margin-bottom: 5px; font-weight: bold;"/>
                            <p:inputText value="#{productoTipoProductoBean.filaSeleccionada.fechaCreacion}" disabled="true" style="width: 100%; background-color: #f0f0f0;">
                                <f:convertDateTime pattern="dd/MM/yyyy HH:mm:ss" type="localDateTime"/>
                            </p:inputText>
                        </div>
                        <div style="margin-bottom: 15px;">
                            <h:outputLabel value="#{crud['form.observaciones']}" style="display: block; margin-bottom: 5px; font-weight: bold;"/>
                            <p:inputTextarea value="#{productoTipoProductoBean.filaSeleccionada.observaciones}" rows="2" style="width: 100%;"/>
                        </div>
                    </div>
                    <f:facet name="footer">
                        <div style="text-align: center; padding: 10px;">
                            <p:commandButton value="#{crud['boton.agregar']}" icon="pi pi-save" styleClass="ui-button-success" style="margin: 0 5px;" action="#{productoTipoProductoBean.btnAgregar}" update=":form:dialogoWrapper :form:messages" process="dlgProductoTipoProducto" rendered="#{productoTipoProductoBean.estado.name() == 'CREAR'}" oncomplete="if (args &amp;&amp; !args.validationFailed) PF('dlgProductoTipoProducto').hide();"/>
                            <p:commandButton value="#{crud['boton.actualizar']}" icon="pi pi-refresh" styleClass="ui-button-info" style="margin: 0 5px;" action="#{productoTipoProductoBean.btnActualizar}" update=":form:dialogoWrapper :form:messages" process="dlgProductoTipoProducto" rendered="#{productoTipoProductoBean.estado.name() == 'MODIFICAR'}" oncomplete="if (args &amp;&amp; !args.validationFailed) PF('dlgProductoTipoProducto').hide();"/>
                            <p:commandButton value="#{crud['boton.eliminar']}" icon="pi pi-trash" styleClass="ui-button-danger" style="margin: 0 5px;" action="#{productoTipoProductoBean.btnEliminar}" update=":form:dialogoWrapper :form:messages" process="@this" rendered="#{productoTipoProductoBean.estado.name() == 'MODIFICAR'}" oncomplete="PF('dlgProductoTipoProducto').hide();">
                                <p:confirm header="#{crud['mensaje.confirmar']}" message="#{crud['mensaje.confirmacion.eliminar']}" icon="pi pi-exclamation-triangle"/>
                            </p:commandButton>
                            <p:commandButton value="#{crud['boton.cancelar']}" icon="pi pi-times" styleClass="ui-button-secondary" style="margin: 0 5px;" onclick="PF('dlgProductoTipoProducto').hide(); return false;" process="@none"/>
                        </div>
                    </f:facet>
                </p:dialog>
            </h:panelGroup>

            <p:confirmDialog global="true" showEffect="fade" hideEffect="fade">
                <p:commandButton value="#{crud['boton.si']}" type="button" styleClass="ui-confirmdialog-yes" icon="pi pi-check" />
                <p:commandButton value="#{crud['boton.no']}" type="button" styleClass="ui-confirmdialog-no" icon="pi pi-times" />
            </p:confirmDialog>

        </h:form>

        <h:form id="formReporte">
            <p:dialog id="dlgReporte"
                      widgetVar="dlgReporte"
                      header="Generar Reporte Kardex"
                      modal="true"
                      width="500"
                      responsive="true">

                <h:panelGroup id="pnlFechasReporte">
                    <p:panelGrid columns="1" layout="grid" styleClass="ui-panelgrid-blank ui-fluid">

                        <p:outputLabel value="Seleccione Producto:" for="cmbProducto" style="font-weight:bold"/>
                        <p:selectOneMenu id="cmbProducto"
                                         value="#{productoBean.idProductoReporte}"
                                         filter="true"
                                         filterMatchMode="contains"
                                         style="width:100%">
                            <f:selectItem itemLabel="-- Seleccione --" itemValue="#{null}"/>
                            <f:selectItems value="#{productoBean.productos}"
                                           var="prod"
                                           itemLabel="#{prod.nombreProducto}"
                                           itemValue="#{prod.id}"/>
                        </p:selectOneMenu>

                        <p:outputLabel value="Desde:" for="calInicio"/>
                        <p:datePicker id="calInicio" value="#{productoBean.fechaInicio}"
                                      showTime="true" pattern="dd/MM/yyyy HH:mm"
                                      required="true" requiredMessage="Fecha inicio requerida"/>

                        <p:outputLabel value="Hasta:" for="calFin"/>
                        <p:datePicker id="calFin" value="#{productoBean.fechaFin}"
                                      showTime="true" pattern="dd/MM/yyyy HH:mm"
                                      required="true" requiredMessage="Fecha fin requerida"/>
                    </p:panelGrid>
                </h:panelGroup>

                <f:facet name="footer">
                    <div style="text-align: right; padding: 5px;">
                        <p:commandButton value="Descargar PDF"
                                         icon="pi pi-download"
                                         action="#{productoBean.descargarKardex}"
                                         ajax="false"
                                         onclick="PF('dlgReporte').hide();"
                                         styleClass="ui-button-success"/>

                        <p:commandButton value="Cancelar"
                                         icon="pi pi-times"
                                         onclick="PF('dlgReporte').hide()"
                                         type="button"
                                         styleClass="ui-button-secondary"
                                         style="margin-left: 5px;"/>
                    </div>
                </f:facet>
            </p:dialog>
        </h:form>

    </ui:define>

</ui:composition>
</html>
