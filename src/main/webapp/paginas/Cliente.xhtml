<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core"
      xmlns:p="http://primefaces.org/ui"
      xmlns:ui="jakarta.faces.facelets"
      xmlns:comp="jakarta.faces.composite/componentes">

<ui:composition template="/WEB-INF/templates/template.xhtml">

    <ui:define name="pageTitle">
        #{crud['pagina.cliente']}
    </ui:define>

    <ui:define name="content">
       
        <!-- ⭐⭐⭐ FIN DE LAS LÍNEAS DE PRUEBA ⭐⭐⭐ -->
        <h:form id="form">

            <p:growl id="messages" showDetail="true" life="3000"/>

            <h:panelGroup id="tablaZone">
                <!-- COMPONENTE TABLA REUTILIZABLE -->
                <comp:Tabla beanName="#{clienteBean}"
                            lazyModel="#{clienteBean.lazyModel}"
                            seleccion="#{clienteBean.filaSeleccionada}"
                            titulo="#{crud['menu.cliente']}"
                            widgetVarDialog="dlgCliente"
                            updateDialog=":form:dialogoWrapper"
                            rows="3"
                            table="tabla"
                            rowKey="#{tipo.id}">

                    <!-- Columnas dinámicas -->
                    <p:column headerText="#{crud['tabla.id']}" style="width: 30px;">
                        <h:outputText value="#{tipo.id}" />
                    </p:column>

                    <p:column headerText="#{crud['tabla.nombre']}" style="width: 80px;">
                        <h:outputText value="#{tipo.nombre}" />
                    </p:column>

                    <p:column headerText="#{crud['tabla.dui']}" style="width: 80px;">
                        <h:outputText value="#{tipo.dui}" />
                    </p:column>

                    <p:column headerText="#{crud['tabla.nit']}" style="width: 80px;">
                        <h:outputText value="#{tipo.nit}" />
                    </p:column>

                    <p:column headerText="#{crud['tabla.activo']}" style="width: 30px;">
                        <h:outputText value="#{tipo.activo ? crud['estado.si'] : crud['estado.no']}" />
                    </p:column>

                </comp:Tabla>
            </h:panelGroup>

            <h:panelGroup id="dialogoWrapper">
                <comp:DialogCrud beanName="#{clienteBean}"
                                 entidadSeleccionada="#{clienteBean.filaSeleccionada}"
                                 widgetVar="dlgCliente"
                                 dialogId="dlgCrud"
                                 updateTabla=":form:tablaZone"
                                 header="#{crud['pagina.cliente']}"
                                 width="500"
                                 maxContentHeight="60vh"
                                 labelId="#{crud['form.id']}"
                                 labelNombre="#{crud['form.nombre']}"
                                 labelActivo="#{crud['form.activo']}"
                                 mostrarObservaciones="false">

                    <f:facet name="dui">
                        <div style="margin-bottom: 15px;">
                            <h:outputLabel value="#{crud['tabla.dui']}:"
                                           for="txtDui"
                                           style="display: block; margin-bottom: 5px; font-weight: bold;"/>
                            <p:inputText id="txtDui"
                                         value="#{clienteBean.filaSeleccionada.dui}"
                                         style="width: 100%;"/>
                        </div>
                    </f:facet>

                    <f:facet name="nit">
                        <div style="margin-bottom: 15px;">
                            <h:outputLabel value="#{crud['tabla.nit']}:"
                                           for="txtNit"
                                           style="display: block; margin-bottom: 5px; font-weight: bold;"/>
                            <p:inputText id="txtNit"
                                         value="#{clienteBean.filaSeleccionada.nit}"
                                         style="width: 100%;"/>
                        </div>
                    </f:facet>

                </comp:DialogCrud>
            </h:panelGroup>

        </h:form>
    </ui:define>

</ui:composition>
</html>
