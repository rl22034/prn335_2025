<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:ui="jakarta.faces.facelets"
      xmlns:h="jakarta.faces.html"
      xmlns:p="http://primefaces.org/ui"
      xmlns:comp="jakarta.faces.composite/componentes">

<ui:composition template="/WEB-INF/templates/template.xhtml">


    <ui:define name="pageTitle">
            #{crud['pagina.tipoAlmacen']}
    </ui:define>


    <ui:define name="content">

        <h:form id="form">

            <p:growl id="messages"
                     showDetail="true"
                     life="3000"
                     autoUpdate="true"/>

            <h:panelGroup id="tablaZone">
                <!-- COMPONENTE TABLA REUTILIZABLE -->
                <comp:Tabla beanName="#{tipoAlmacenBean}"
                            lazyModel="#{tipoAlmacenBean.lazyModel}"
                            seleccion="#{tipoAlmacenBean.filaSeleccionada}"
                            titulo="#{crud['menu.tipoAlmacen']}"
                            widgetVarDialog="dlgTipoAlmacen"
                            updateDialog=":form:dialogoWrapper"
                            rows="3"
                            table="tabla"
                            rowKey="#{tipo.id}">

                    <!-- Columnas dinámicas -->
                    <p:column headerText="Id">
                        <h:outputText value="#{tipo.id}" />
                    </p:column>

                    <p:column headerText="#{crud['tabla.nombre']}">
                        <h:outputText value="#{tipo.nombre}" />
                    </p:column>

                    <p:column headerText="#{crud['tabla.activo']}">
                        <h:outputText value="#{tipo.activo ? crud['estado.si'] : crud['estado.no']}" />
                    </p:column>

                    <p:column headerText="#{crud['tabla.observaciones']}">
                        <h:outputText value="#{tipo.obsevaciones}" />
                    </p:column>

                </comp:Tabla>
            </h:panelGroup>

            <h:panelGroup id="dialogoWrapper">
                <comp:DialogCrud beanName="#{tipoAlmacenBean}"
                                 entidadSeleccionada="#{tipoAlmacenBean.filaSeleccionada}"
                                 widgetVar="dlgTipoAlmacen"
                                 dialogId="dlgCrud"
                                 updateTabla=":form:tablaZone"
                                 header="#{crud['pagina.tipoAlmacen']}"
                                 width="500"
                                 maxContentHeight="60vh"
                                 labelId="#{crud['form.id']}"
                                 labelNombre="#{crud['form.nombre']}"
                                 labelActivo="#{crud['form.activo']}"
                                 labelObservaciones="#{crud['form.observaciones']}"
                                 atributoObservaciones="obsevaciones">
                </comp:DialogCrud>
            </h:panelGroup>

        </h:form>

    </ui:define>

</ui:composition>
</html>
